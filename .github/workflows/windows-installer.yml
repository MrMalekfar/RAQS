name: Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'packaging/windows/**'
      - 'raqs_gui/**'
      - 'requirements*.txt'
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
      - name: Build installer
        shell: pwsh
        run: |
          $version = '0.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.Substring(1) }
          python packaging/windows/build_installer.py $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RAQS_VERSION=$version"
      - name: Test installed application
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'RAQS installer test'
          $install = Join-Path $testRoot 'installed app'
          New-Item -ItemType Directory -Path $testRoot | Out-Null
          $setup = (Resolve-Path 'outputs/windows-installer/RAQS-Setup.exe').Path
          $smoke = (Resolve-Path 'packaging/windows/smoke_installed.py').Path
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $setupArgs = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR="{0}" /LOG="{1}"' -f $install, (Join-Path $testRoot 'setup.log')
          $result = Start-Process $setup -ArgumentList $setupArgs -WindowStyle Hidden -Wait -PassThru
          if ($result.ExitCode -ne 0) {
            Get-Content -LiteralPath (Join-Path $testRoot 'setup.log') -ErrorAction SilentlyContinue
            throw "RAQS Setup exited with code $($result.ExitCode)"
          }
          $pythonw = Join-Path (Join-Path $install $env:RAQS_VERSION) 'runtime\pythonw.exe'
          $menu = [Environment]::GetFolderPath('Programs')
          $link = Join-Path $menu 'RAQS Research Workbench.lnk'
          if (-not (Test-Path -LiteralPath $link)) { throw 'RAQS Start menu shortcut is missing' }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($link)
          if ($shortcut.TargetPath -ne $pythonw -or $shortcut.Arguments -ne '-m raqs_gui') {
            throw 'RAQS Start menu shortcut targets the wrong interpreter or module'
          }
          $arguments = '"{0}" "{1}"' -f $smoke, $testRoot
          $result = Start-Process $pythonw -ArgumentList $arguments -WorkingDirectory $testRoot -WindowStyle Hidden -Wait -PassThru
          $smokeLog = Join-Path $testRoot 'smoke.log'
          if ($result.ExitCode -ne 0) {
            Get-Content -LiteralPath $smokeLog -ErrorAction SilentlyContinue
            throw "RAQS smoke test exited with code $($result.ExitCode)"
          }
          Get-Content -LiteralPath $smokeLog -ErrorAction Stop
      - name: Upload tested installer
        uses: actions/upload-artifact@v6
        with:
          name: RAQS-Windows-x64
          path: outputs/windows-installer/RAQS-Setup.exe
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: RAQS-Windows-x64
      - name: Publish tested installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" RAQS-Setup.exe --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "RAQS $GITHUB_REF_NAME" \
            --notes 'Download RAQS-Setup.exe for Windows x64. Python and the runtime dependencies are included. Open RAQS Research Workbench from the Start menu after installation.'
